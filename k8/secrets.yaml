apiVersion: v1
kind: Secret
metadata:
  name: gogi-secrets
  namespace: gogi

type: Opaque

stringData:

  POSTGRES_USER: gogi
  POSTGRES_PASSWORD: gogi
  POSTGRES_DB: gogi

  # Read by utils.GetDatabaseURL() via the DATABASE_URL env var. Must stay in
  # sync with POSTGRES_USER/POSTGRES_PASSWORD/POSTGRES_DB above and the
  # postgres Service's DNS name (postgres:5432).
  DATABASE_URL: postgres://gogi:gogi@postgres:5432/gogi

  # Consumed directly by the minio container's own bootstrap (see
  # k8/minio/statefulset.yaml). The prompts deployment re-exposes these
  # same values under the GOGI_-prefixed names its code reads.
  MINIO_ROOT_USER: admin
  MINIO_ROOT_PASSWORD: password

  # Read by the llms service to call the Anthropic API. Replace with a real
  # key before deploying — this placeholder will fail at call time, not at
  # startup.
  ANTHROPIC_API_KEY: REPLACE_ME