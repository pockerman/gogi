apiVersion: v1
kind: ConfigMap
metadata:
  name: gogi-config
  namespace: gogi

data:

  # Vector DB (Chroma) connection — read by utils.GetVectorDBStorageConnectionDetails()
  GOGI_VECTOR_DB_TYPE: chroma
  GOGI_VECTOR_DB_HOST: chromadb
  GOGI_VECTOR_DB_PORT: "8000"

  # MinIO connection — read by the prompts service. Credentials live in
  # the gogi-secrets Secret (GOGI_MINIO_ROOT_USER / GOGI_MINIO_ROOT_PASSWORD).
  GOGI_MINIO_HOST: minio:9000

  # Gateway's view of every platform service it proxies to, keyed by the
  # env var each backend's RegisterPlatformServices call looks up.
  GOGI_DOCUMENT_SERVICE_ADDR: documents:50054
  GOGI_INDEX_SERVICE_ADDR: indexes:50055
  GOGI_LLM_SERVICE_ADDR: llms:50057
  GOGI_PROMPTS_SERVICE_ADDR: prompts:50058
  GOGI_LLM_SESSIONS_ADDR: llm-sessions:50059
  GOGI_LLM_TOOLS_SERVICE_ADDR: llm-tools:50060
  GOGI_WORKFLOW_SERVICE_ADDR: workflows:50053
