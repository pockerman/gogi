apiVersion: apps/v1
kind: Deployment

metadata:
  name: llm-sessions
  namespace: gogi
spec:
  replicas: 2
  selector:
    matchLabels:
      app: llm-sessions
  template:
    metadata:
      labels:
        app: llm-sessions
    spec:
      containers:
      - name: llm-sessions
        image: gogi/llm-sessions:latest
        imagePullPolicy: IfNotPresent

        ports:
        - containerPort: 50059
        envFrom:
        - configMapRef:
            name: gogi-config
        - secretRef:
            name: gogi-secrets
