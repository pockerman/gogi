# gogi on one server, for a deployment many applications use (docs/deployment.md).
#
# Unlike ../docker-compose.yml, which builds everything for development, this runs the published images
# (ghcr.io/<owner>/gogi-<image>), and:
# - Postgres is the cloud's (RDS, or Azure Database for PostgreSQL), not a container
# - documents are ingested by a function the cloud's queue triggers (a Lambda fed by SQS, an Azure Function fed by a
#   Storage queue), or, until one is set up, by the ingestion worker here, polling a queue table in Postgres
# - only Caddy is reachable from outside: it serves the gateway's gRPC over TLS on 443, with the certificate in ./certs
# - the gateway takes only calls with an application's key, and the services scope everything to its application
# - files, e.g. documents' uploads, are kept in the cloud's object storage (S3, or Azure Blob Storage), not MinIO
# - Chroma's and Caddy's data, and the embedding models, are kept in ${GOGI_DATA_DIR}, a disk of its own that
#   outlives the server
#
# Its settings come from .env, which the server's start script writes (deploy/<cloud>/start-gogi.sh):
#   GOGI_IMAGES, GOGI_IMAGE_TAG     the images, e.g. ghcr.io/pockerman and main, or sha-<commit>
#   GOGI_DATA_DIR                   where the data is kept, e.g. /data
#   GOGI_DB_HOST, GOGI_DB_PORT, GOGI_DB_NAME, GOGI_DB_USER, GOGI_DB_PASSWORD
#   GOGI_OBJECT_STORE               where files are kept, s3 or azure, and the store's settings, e.g. GOGI_S3_ENDPOINT,
#                                   or AZURE_STORAGE_ACCOUNT_URL; and GOGI_DOCUMENTS_BUCKET, GOGI_PROMPTS_BUCKET
#   GOGI_TLS_NAME                   the name or address the certificate is for, e.g. the server's public IP
#   GOGI_CREDENTIAL_STORE           where applications' provider keys are kept, e.g. aws, and the store's settings,
#                                   e.g. GOGI_CREDENTIAL_PREFIX and AWS_REGION, or AZURE_KEY_VAULT_URL and
#                                   AZURE_CLIENT_ID
#   GOGI_INGESTION_QUEUE            where ingestions wait: postgres, with COMPOSE_PROFILES=ingestion-worker so the worker
#                                   here runs; or sqs (GOGI_SQS_QUEUE_URL) or azure (GOGI_AZURE_QUEUE_URL) for a function
#   GOGI_PRIVATE_IP                 the server's address in its network: Chroma and the model service are published
#                                   on it for the ingestion function, which the cloud's firewall lets in alone
#
# The operator registers applications with gogi-admin, in the gateway's container:
#   docker compose exec gateway /root/gogi-admin register qubit-notes

name: gogi

x-service: &service
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

x-gogi-environment: &gogi-environment
  GOGI_LOG_LEVEL: ${GOGI_LOG_LEVEL:-info}
  DATABASE_URL: postgres://${GOGI_DB_USER}:${GOGI_DB_PASSWORD}@${GOGI_DB_HOST}:${GOGI_DB_PORT:-5432}/${GOGI_DB_NAME:-gogi}?sslmode=${GOGI_DB_SSLMODE:-require}
  GOGI_GATEWAY_URL: gateway:50051
  # gRPC inside the server is plaintext; TLS ends at Caddy
  GOGI_GATEWAY_INSECURE: "1"
  GOGI_OBSERVABILITY_ADDR: observability:50062
  # every call must say which application it is for, as the gateway does once it has taken the application's key
  GOGI_REQUIRE_APPLICATION: "true"

x-vector-db: &vector-db
  GOGI_VECTOR_DB_TYPE: chroma
  GOGI_VECTOR_DB_HOST: chromadb
  GOGI_VECTOR_DB_PORT: "8000"

x-object-store: &object-store
  GOGI_OBJECT_STORE: ${GOGI_OBJECT_STORE}
  GOGI_S3_ENDPOINT: ${GOGI_S3_ENDPOINT:-}
  # only for an S3-compatible store that isn't AWS': on AWS, the server's role signs in, over TLS
  GOGI_S3_ACCESS_KEY: ${GOGI_S3_ACCESS_KEY:-}
  GOGI_S3_SECRET_KEY: ${GOGI_S3_SECRET_KEY:-}
  GOGI_S3_SECURE: ${GOGI_S3_SECURE:-true}
  GOGI_DOCUMENTS_BUCKET: ${GOGI_DOCUMENTS_BUCKET}
  GOGI_PROMPTS_BUCKET: ${GOGI_PROMPTS_BUCKET}
  AWS_REGION: ${AWS_REGION:-}
  AZURE_STORAGE_ACCOUNT_URL: ${AZURE_STORAGE_ACCOUNT_URL:-}
  AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}

x-credential-store: &credential-store
  GOGI_CREDENTIAL_STORE: ${GOGI_CREDENTIAL_STORE:-none}
  GOGI_CREDENTIAL_PREFIX: ${GOGI_CREDENTIAL_PREFIX:-gogi/credentials/}
  AWS_REGION: ${AWS_REGION:-}
  # on Azure: the vault, and the managed identity of the server's that may use it
  AZURE_KEY_VAULT_URL: ${AZURE_KEY_VAULT_URL:-}
  AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}

x-gogi-service: &gogi-service
  <<: *service
  depends_on:
    migrations:
      condition: service_completed_successfully

# the small text embedding models gogi runs, each in a text embeddings inference server of its own; they download
# their model once, into the data disk, and keep it when they're replaced; one tokenizer and small batches keep each in about half a GB
x-embedding-model: &embedding-model
  <<: *service
  image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8.2
  volumes:
    - ${GOGI_DATA_DIR}/huggingface:/data

x-ingestion-worker-environment: &ingestion-worker-environment
  <<: *object-store
  VECTOR_STORAGE_TYPE: chromadb
  VECTOR_STORAGE_HOST: chromadb
  VECTOR_STORAGE_PORT: "8000"
  DB_HOST: ${GOGI_DB_HOST}
  DB_PORT: ${GOGI_DB_PORT:-5432}
  DB_NAME: ${GOGI_DB_NAME:-gogi}
  DB_USER: ${GOGI_DB_USER}
  DB_PASSWORD: ${GOGI_DB_PASSWORD}
  # the worker runs no embedding model: the model service embeds the chunks, with the application's keys
  GOGI_LLM_SERVICE_ADDR: llms:50057

services:

  caddy:
    <<: *service
    image: caddy:2.10.2-alpine
    ports:
      - "443:443"
    environment:
      GOGI_TLS_NAME: ${GOGI_TLS_NAME}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - ${GOGI_DATA_DIR}/caddy:/data
    depends_on:
      - gateway

  migrations:
    image: ${GOGI_IMAGES}/gogi-migrations:${GOGI_IMAGE_TAG}
    environment:
      DATABASE_URL: postgres://${GOGI_DB_USER}:${GOGI_DB_PASSWORD}@${GOGI_DB_HOST}:${GOGI_DB_PORT:-5432}/${GOGI_DB_NAME:-gogi}?sslmode=${GOGI_DB_SSLMODE:-require}

  chromadb:
    <<: *service
    image: chromadb/chroma:1.4.0
    # for the ingestion function only; GOGI_PRIVATE_IP is the server's address in its network
    ports:
      - "${GOGI_PRIVATE_IP:-127.0.0.1}:8000:8000"
    volumes:
      - ${GOGI_DATA_DIR}/chroma:/data
    # every collection holds files open: the default limit of 1024 runs out after a few hundred
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  gateway:
    <<: *gogi-service
    image: ${GOGI_IMAGES}/gogi-gateway:${GOGI_IMAGE_TAG}
    environment:
      <<: *gogi-environment
      GOGI_APPLICATION_KEYS: required
      GOGI_GATEWAY_PORT: ":50051"
      GOGI_GATEWAY_PROTOCOL: tcp
      GOGI_WORKFLOW_SERVICE_ADDR: workflows:50053
      GOGI_DOCUMENT_SERVICE_ADDR: documents:50054
      GOGI_INDEX_SERVICE_ADDR: indexes:50055
      GOGI_LLM_SERVICE_ADDR: llms:50057
      GOGI_PROMPTS_SERVICE_ADDR: prompts:50058
      GOGI_LLM_SESSIONS_ADDR: llm-sessions:50059
      GOGI_LLM_TOOLS_SERVICE_ADDR: llm-tools:50060
      GOGI_GUARDRAILS_SERVICE_ADDR: guardrails:50061
      GOGI_OBSERVABILITY_SERVICE_ADDR: observability:50062

  documents:
    <<: *gogi-service
    image: ${GOGI_IMAGES}/gogi-documents:${GOGI_IMAGE_TAG}
    environment:
      <<: [*gogi-environment, *vector-db, *object-store]
      GOGI_DOCUMENTS_MAX_UPLOAD_MB: ${GOGI_DOCUMENTS_MAX_UPLOAD_MB:-100}
      GOGI_LLM_SERVICE_ADDR: llms:50057
      # the queue ingestions are handed to the worker through, as the server's role or managed identity
      GOGI_INGESTION_QUEUE: ${GOGI_INGESTION_QUEUE:-postgres}
      GOGI_SQS_QUEUE_URL: ${GOGI_SQS_QUEUE_URL:-}
      GOGI_AZURE_QUEUE_URL: ${GOGI_AZURE_QUEUE_URL:-}

  indexes:
    <<: *gogi-service
    image: ${GOGI_IMAGES}/gogi-indexes:${GOGI_IMAGE_TAG}
    environment:
      <<: [*gogi-environment, *vector-db, *object-store]

  llms:
    <<: *gogi-service
    image: ${GOGI_IMAGES}/gogi-llms:${GOGI_IMAGE_TAG}
    environment:
      <<: [*gogi-environment, *vector-db, *credential-store]
      GOGI_LLMS_PORT: ":50057"
      # applications' keys stay here: the ingestion function asks the model service to embed
      GOGI_EMBEDDINGS_BGE_SMALL_URL: http://embeddings-bge-small/v1
      GOGI_EMBEDDINGS_MINILM_URL: http://embeddings-minilm/v1
      # applications' own models must be on the internet, never on the server's network or the cloud's metadata
      # endpoint
      GOGI_EMBEDDINGS_ALLOW_PRIVATE_URLS: "false"
    # for the ingestion function only, as Chroma is
    ports:
      - "${GOGI_PRIVATE_IP:-127.0.0.1}:50057:50057"
    depends_on:
      migrations:
        condition: service_completed_successfully
      embeddings-bge-small:
        condition: service_started
      embeddings-minilm:
        condition: service_started

  embeddings-bge-small:
    <<: *embedding-model
    command: --model-id BAAI/bge-small-en-v1.5 --tokenization-workers 1 --max-batch-tokens 4096

  embeddings-minilm:
    <<: *embedding-model
    command: --model-id sentence-transformers/all-MiniLM-L6-v2 --tokenization-workers 1 --max-batch-tokens 4096

  prompts:
    <<: *gogi-service
    image: ${GOGI_IMAGES}/gogi-prompts:${GOGI_IMAGE_TAG}
    environment:
      <<: [*gogi-environment, *object-store]
      GOGI_PROMPTS_PORT: ":50058"

  llm-sessions:
    <<: *gogi-service
    image: ${GOGI_IMAGES}/gogi-llm-sessions:${GOGI_IMAGE_TAG}
    environment:
      <<: *gogi-environment
      GOGI_LLMS_SESSION_PORT: ":50059"
      GOGI_LLM_SERVICE_ADDR: llms:50057

  llm-tools:
    <<: *gogi-service
    image: ${GOGI_IMAGES}/gogi-llm-tools:${GOGI_IMAGE_TAG}
    environment:
      <<: [*gogi-environment, *credential-store]
      GOGI_LLM_TOOLS_PORT: ":50060"

  workflows:
    <<: *gogi-service
    image: ${GOGI_IMAGES}/gogi-workflows:${GOGI_IMAGE_TAG}
    environment:
      <<: *gogi-environment
      GOGI_WORKFLOWS_PORT: ":50053"

  observability:
    <<: *gogi-service
    image: ${GOGI_IMAGES}/gogi-observability:${GOGI_IMAGE_TAG}
    environment:
      <<: *gogi-environment
      GOGI_OBSERVABILITY_PORT: ":50062"

  guardrails:
    <<: *gogi-service
    image: ${GOGI_IMAGES}/gogi-guardrails:${GOGI_IMAGE_TAG}
    environment:
      <<: *gogi-environment
      GOGI_GUARDRAILS_PORT: ":50061"

  # ingests the documents queued in Postgres, until the ingestion runs as a function: started only with the profile
  # ingestion-worker
  ingest-documents-worker:
    <<: *service
    image: ${GOGI_IMAGES}/gogi-python-worker:${GOGI_IMAGE_TAG}
    profiles: [ingestion-worker]
    environment:
      <<: *ingestion-worker-environment
    depends_on:
      migrations:
        condition: service_completed_successfully
      chromadb:
        condition: service_started
      llms:
        condition: service_started
