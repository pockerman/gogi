name: Images

# gogi's container images, one for each service and worker, and one for the database migrations. Built and pushed
# from main as ghcr.io/<owner>/gogi-<image>:main and :sha-<commit>; not for PRs, to save the private repo's minutes.
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: gateway, dockerfile: docker/gateway.Dockerfile }
          - { image: documents, dockerfile: docker/documents.Dockerfile }
          - { image: indexes, dockerfile: docker/indexes.Dockerfile }
          - { image: llms, dockerfile: docker/llms.Dockerfile }
          - { image: prompts, dockerfile: docker/prompts.Dockerfile }
          - { image: llm-sessions, dockerfile: docker/llm_sessions.Dockerfile }
          - { image: llm-tools, dockerfile: docker/llm_tools.Dockerfile }
          - { image: workflows, dockerfile: docker/workflows.Dockerfile }
          - { image: observability, dockerfile: docker/observability.Dockerfile }
          - { image: guardrails, dockerfile: docker/guardrails.Dockerfile }
          # the ingestion worker, polling Postgres (docker-compose.yml, and a server without functions)
          - { image: python-worker, dockerfile: docker/ingest_document_python_worker.Dockerfile }
          # the ingestion worker as an AWS Lambda; deploy/aws/push-ingestion-image.sh copies it to ECR, as Lambda
          # runs images from ECR only
          - { image: ingest-lambda, dockerfile: docker/ingest_document_lambda.Dockerfile }
          - { image: migrations, dockerfile: docker/migrations.Dockerfile }
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # the Go services are built from the generated protobuf code, which isn't kept in the repository
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          # without a token, GitHub's API limits the action's requests and the step fails now and then
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate protobufs
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
          export PATH="$(go env GOPATH)/bin:$PATH"
          ./build_protobuf.sh

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/gogi-${{ matrix.image }}:main
            ghcr.io/${{ github.repository_owner }}/gogi-${{ matrix.image }}:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
