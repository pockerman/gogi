# gogi[AI] Docker Compose Configuration
# `docker compose up` brings up the seven platform services + a
# pgvector-enabled Postgres on a shared network. The gateway is the only
# service whose ports are mapped to the host (8080 for external HTTP,
# 50051 for the SDK's gRPC channel); everything else is reachable only
# from inside the compose network, by container name (e.g.,
# `sessions:50052`).
#
# Each container runs the same image artifact a platform team would push
# to a registry and reference from a Kubernetes Deployment — see
# `docker/*.Dockerfile`. The compose file maps env vars to the same
# config knobs the production deployment would use.
#
# Once this is up, `genai-platform deploy <file>` (run from the host)
# packages a workflow into its own container and the Workflow Service
# launches it onto the same compose network, so the gateway can route
# traffic to it.

name: gogi
services:

  postgres:
    image: postgres:16
    container_name: gogi-postgres
    environment:
      POSTGRES_DB: gogi
      POSTGRES_USER: gogi
      POSTGRES_PASSWORD: gogi
    ports:
    - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
  chromadb:
    image: chromadb/chroma:latest
    container_name: gogi-chromadb
    ports:
      - "8000:8000"
    volumes:
      - chroma-data:/chroma/chroma
    restart: unless-stopped
  minio:
    # quay.io/minio/aistor/minio is MinIO's licensed "AIStor" edition and refuses all
    # bucket/object operations without a paid license ("Access Denied. No license is
    # installed."), even though health checks pass. bitnamilegacy/minio is a free,
    # unmodified community MinIO build with no such restriction.
    image: bitnamilegacy/minio:latest
    container_name: gogi-minio
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=password
    restart: unless-stopped
    ports:
      - 9001:9001
      - 9000:9000
  gateway:
    build:
      context: .
      dockerfile: docker/gateway.Dockerfile
    container_name: gogi-gateway
    ports:
      - "8080:8080"
      - "50051:50051"
    environment:
      - GOGI_GATEWAY_PORT=:50051
      - GOGI_GATEWAY_PROTOCOL=tcp
      - GOGI_LOG_LEVEL=debug
      - GOGI_SESSION_SERVICE_ADDR=sessions:50052
      - GOGI_WORKFLOW_SERVICE_ADDR=workflows:50053
      - GOGI_DOCUMENT_SERVICE_ADDR=documents:50054
      - GOGI_INDEX_SERVICE_ADDR=indexes:50055
      - GOGI_EMBEDDING_SERVICE_ADDR=embeddings:50056
      - GOGI_LLM_SERVICE_ADDR=llms:50057
      - GOGI_PROMPTS_SERVICE_ADDR=prompts:50058
      - GOGI_LLM_SESSIONS_ADDR=llm-sessions:50059
      - GOGI_LLM_TOOLS_SERVICE_ADDR=llm-tools:50060
      - GOGI_VECTOR_DB_SERVICE_ADDR=vector-db:50059 # TODO Fix this
    depends_on:
      - documents
      - indexes
      - workflows
      - postgres
  documents:
    build:  
      context: .
      dockerfile: docker/documents.Dockerfile
    container_name: gogi-documents
    environment:
      - GOGI_LOG_LEVEL=debug
      - GOGI_GATEWAY_URL=gateway:50051
      - GOGI_GATEWAY_INSECURE="1"   # in-cluster gRPC is plaintext
      - GOGI_VECTOR_DB_TYPE=chroma
      - GOGI_VECTOR_DB_HOST=chromadb
      - GOGI_VECTOR_DB_PORT=8000
      - GOGI_INGESTION_DOCUMENT_QUEUE_NAME=ingestion-document-queue
      - TEMPORAL_HOST=host.docker.internal:7233
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres
      - chromadb
  indexes:
    build:  
      context: .
      dockerfile: docker/indexes.Dockerfile
    container_name: gogi-indexes
    environment:
      - GOGI_LOG_LEVEL=debug
      - GOGI_GATEWAY_URL=gateway:50051
      - GOGI_GATEWAY_INSECURE="1"   # in-cluster gRPC is plaintext
      - GOGI_VECTOR_DB_TYPE=chroma
      - GOGI_VECTOR_DB_HOST=chromadb
      - GOGI_VECTOR_DB_PORT=8000
    depends_on:
      - postgres
      - chromadb
  # HashiCorp Vault dev server: the default credential store for local development.
  # Dev mode keeps everything in memory, unsealed, with a fixed root token:
  # never use it outside development
  vault:
    image: hashicorp/vault:1.20
    container_name: gogi-vault
    cap_add:
      - IPC_LOCK
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=gogi-dev-root-token
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200
    ports:
      - "8200:8200"

  # LocalStack emulates AWS Secrets Manager. Start it with
  # GOGI_CREDENTIAL_STORE=aws docker compose --profile aws up
  localstack:
    image: localstack/localstack:4
    container_name: gogi-localstack
    profiles:
      - aws
    environment:
      - SERVICES=secretsmanager
    ports:
      - "4566:4566"

  llms:
    build:
      context: .
      dockerfile: docker/llms.Dockerfile
    container_name: gogi-llms
    environment:
      - GOGI_LOG_LEVEL=debug
      - GOGI_GATEWAY_URL=gateway:50051
      - GOGI_GATEWAY_INSECURE="1"   # in-cluster gRPC is plaintext
      - GOGI_VECTOR_DB_TYPE=chroma
      - GOGI_VECTOR_DB_HOST=chromadb
      - GOGI_VECTOR_DB_PORT=8000
      - GOGI_LLMS_PORT=:50057
      - ANTHROPIC_API_KEY=1234569878
      - OPENAI_API_KEY=1234569878
      # credential store of registered models: vault (default) or aws (LocalStack)
      - GOGI_CREDENTIAL_STORE=${GOGI_CREDENTIAL_STORE:-vault}
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=gogi-dev-root-token
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    depends_on:
      - postgres
      - chromadb
      - vault
  prompts:
    build:
      context: .
      dockerfile: docker/prompts.Dockerfile
    container_name: gogi-prompts
    environment:
      - GOGI_LOG_LEVEL=debug
      - GOGI_GATEWAY_URL=gateway:50051
      - GOGI_GATEWAY_INSECURE="1"   # in-cluster gRPC is plaintext
      - GOGI_PROMPTS_PORT=:50058
      - GOGI_MINIO_HOST=minio:9000 
      - GOGI_MINIO_ROOT_USER=admin
      - GOGI_MINIO_ROOT_PASSWORD=password
    depends_on:
      - postgres
  llm-sessions:
    build:
      context: .
      dockerfile: docker/llm_sessions.Dockerfile
    container_name: gogi-llm-sessions
    environment:
      - GOGI_LOG_LEVEL=debug
      - GOGI_GATEWAY_URL=gateway:50051
      - GOGI_GATEWAY_INSECURE="1"   # in-cluster gRPC is plaintext
      - GOGI_LLMS_SESSION_PORT=:50059
    depends_on:
      - postgres
  llm-tools:
    build:
      context: .
      dockerfile: docker/llm_tools.Dockerfile
    container_name: gogi-llm-tools
    environment:
      - GOGI_LOG_LEVEL=debug
      - GOGI_GATEWAY_URL=gateway:50051
      - GOGI_GATEWAY_INSECURE="1"   # in-cluster gRPC is plaintext
      - GOGI_LLM_TOOLS_PORT=:50060
    depends_on:
      - postgres
  workflows:
    build:
      context: .
      dockerfile: docker/workflows.Dockerfile
    container_name: gogi-workflows
    environment:
      - GOGI_LOG_LEVEL=debug
      - GOGI_GATEWAY_URL=gateway:50051
      - GOGI_GATEWAY_INSECURE="1"   # in-cluster gRPC is plaintext
      - GOGI_WORKFLOWS_PORT=:50053
    depends_on:
      - postgres


  # The Go Temporal Worker Executes the Go workflow (orchestration)
  # Runs the orchestration logic (IngestDocumentWorkflow)
  ingest-documents-go-worker:
    build:
      context: .
      dockerfile: docker/ingest_document_go_worker.Dockerfile 
    environment:
      - GOGI_LOG_LEVEL=debug
      - TEMPORAL_HOST=host.docker.internal:7233
      - WORK_QUEUE=ingestion-document-queue
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      #- temporal
      - documents # Ensures network is ready
      - postgres
      - chromadb
    restart: unless-stopped
  ingest-documents-python-worker:
    build:
      context: .
      dockerfile: docker/ingest_document_python_worker.Dockerfile 
    environment:
      - TEMPORAL_HOST=host.docker.internal:7233
      - TASK_QUEUE=ingestion-document-queue
      - ACTIVITY_NAME=ingest_document
      - VECTOR_STORAGE_TYPE=chromadb
      - VECTOR_STORAGE_HOST=chromadb
      - VECTOR_STORAGE_PORT=8000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=gogi
      - DB_USER=gogi
      - DB_PASSWORD=gogi
      - OPENAI_API_KEY=1234569878
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - documents
      - postgres
      - chromadb
    restart: unless-stopped
volumes:
  postgres-data:
  chroma-data:
  

