# gogi[AI] Docker Compose Configuration
# `docker compose up` brings up the seven platform services + a
# pgvector-enabled Postgres on a shared network. The gateway is the only
# service whose ports are mapped to the host (8080 for external HTTP,
# 50051 for the SDK's gRPC channel); everything else is reachable only
# from inside the compose network, by container name (e.g.,
# `sessions:50052`).
#
# Each container runs the same image artifact a platform team would push
# to a registry and reference from a Kubernetes Deployment — see
# `docker/*.Dockerfile`. The compose file maps env vars to the same
# config knobs the production deployment would use.
#
# Once this is up, `genai-platform deploy <file>` (run from the host)
# packages a workflow into its own container and the Workflow Service
# launches it onto the same compose network, so the gateway can route
# traffic to it.

name: gogi
services:

  postgres:
    image: postgres:16
    container_name: gogi-postgres
    environment:
      POSTGRES_DB: gogi
      POSTGRES_USER: gogi
      POSTGRES_PASSWORD: gogi
    ports:
    - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
  chromadb:
    image: chromadb/chroma:latest
    container_name: gogi-chromadb
    ports:
      - "8000:8000"
    volumes:
      # where chroma keeps its data; /chroma/chroma, mounted before, left it in the container
      - chroma-data:/data
    # every collection holds files open: the default limit of 1024 runs out after a few hundred
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    restart: unless-stopped
  minio:
    # quay.io/minio/aistor/minio is MinIO's licensed "AIStor" edition and refuses all
    # bucket/object operations without a paid license ("Access Denied. No license is
    # installed."), even though health checks pass. bitnamilegacy/minio is a free,
    # unmodified community MinIO build with no such restriction.
    image: bitnamilegacy/minio:latest
    container_name: gogi-minio
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=password
    restart: unless-stopped
    ports:
      - 9001:9001
      - 9000:9000
  gateway:
    build:
      context: .
      dockerfile: docker/gateway.Dockerfile
    container_name: gogi-gateway
    ports:
      - "8080:8080"
      - "50051:50051"
    environment:
      - GOGI_OBSERVABILITY_ADDR=observability:50062
      - GOGI_GATEWAY_PORT=:50051
      - GOGI_GATEWAY_PROTOCOL=tcp
      - GOGI_LOG_LEVEL=debug
      - GOGI_SESSION_SERVICE_ADDR=sessions:50052
      - GOGI_WORKFLOW_SERVICE_ADDR=workflows:50053
      - GOGI_DOCUMENT_SERVICE_ADDR=documents:50054
      - GOGI_INDEX_SERVICE_ADDR=indexes:50055
      - GOGI_EMBEDDING_SERVICE_ADDR=embeddings:50056
      - GOGI_LLM_SERVICE_ADDR=llms:50057
      - GOGI_PROMPTS_SERVICE_ADDR=prompts:50058
      - GOGI_LLM_SESSIONS_ADDR=llm-sessions:50059
      - GOGI_LLM_TOOLS_SERVICE_ADDR=llm-tools:50060
      - GOGI_GUARDRAILS_SERVICE_ADDR=guardrails:50061
      - GOGI_OBSERVABILITY_SERVICE_ADDR=observability:50062
      - GOGI_VECTOR_DB_SERVICE_ADDR=vector-db:50059 # TODO Fix this
    depends_on:
      - documents
      - indexes
      - workflows
      - postgres
  # the gateway as it runs where applications subscribe to gogi: every call carries a key of its
  # application (gogi-admin register <application>). It shares the services with the gateway above,
  # which needs no keys and serves every call as the "default" application, as in development
  gateway-applications:
    build:
      context: .
      dockerfile: docker/gateway.Dockerfile
    container_name: gogi-gateway-applications
    ports:
      - "50050:50051"
    environment:
      - GOGI_APPLICATION_KEYS=required
      - GOGI_OBSERVABILITY_ADDR=observability:50062
      - GOGI_GATEWAY_PORT=:50051
      - GOGI_GATEWAY_PROTOCOL=tcp
      - GOGI_LOG_LEVEL=debug
      - GOGI_WORKFLOW_SERVICE_ADDR=workflows:50053
      - GOGI_DOCUMENT_SERVICE_ADDR=documents:50054
      - GOGI_INDEX_SERVICE_ADDR=indexes:50055
      - GOGI_LLM_SERVICE_ADDR=llms:50057
      - GOGI_PROMPTS_SERVICE_ADDR=prompts:50058
      - GOGI_LLM_SESSIONS_ADDR=llm-sessions:50059
      - GOGI_LLM_TOOLS_SERVICE_ADDR=llm-tools:50060
      - GOGI_GUARDRAILS_SERVICE_ADDR=guardrails:50061
      - GOGI_OBSERVABILITY_SERVICE_ADDR=observability:50062
    depends_on:
      - gateway
  documents:
    build:  
      context: .
      dockerfile: docker/documents.Dockerfile
    container_name: gogi-documents
    environment:
      - GOGI_LOG_LEVEL=debug
      - GOGI_GATEWAY_URL=gateway:50051
      - GOGI_GATEWAY_INSECURE="1"   # in-cluster gRPC is plaintext
      - GOGI_VECTOR_DB_TYPE=chroma
      - GOGI_VECTOR_DB_HOST=chromadb
      - GOGI_VECTOR_DB_PORT=8000
      # ingestions wait in a queue table in Postgres for the ingestion worker; searches and deletes go to Chroma
      - GOGI_INGESTION_QUEUE=postgres
      # uploads are kept in MinIO; the ingestion message carries only their key
      - GOGI_MINIO_HOST=minio:9000
      - GOGI_MINIO_ROOT_USER=admin
      - GOGI_MINIO_ROOT_PASSWORD=password
      - GOGI_DOCUMENTS_MAX_UPLOAD_MB=100
      # the embedding models a document is ingested with are the model service's to know
      - GOGI_LLM_SERVICE_ADDR=llms:50057
    depends_on:
      - postgres
      - chromadb
      - minio
      - llms
  indexes:
    build:  
      context: .
      dockerfile: docker/indexes.Dockerfile
    container_name: gogi-indexes
    environment:
      - GOGI_LOG_LEVEL=debug
      - GOGI_GATEWAY_URL=gateway:50051
      - GOGI_GATEWAY_INSECURE="1"   # in-cluster gRPC is plaintext
      - GOGI_VECTOR_DB_TYPE=chroma
      - GOGI_VECTOR_DB_HOST=chromadb
      - GOGI_VECTOR_DB_PORT=8000
      # deleting an index deletes its documents' files
      - GOGI_MINIO_HOST=minio:9000
      - GOGI_MINIO_ROOT_USER=admin
      - GOGI_MINIO_ROOT_PASSWORD=password
    depends_on:
      - postgres
      - chromadb
      - minio
  # HashiCorp Vault dev server: the default credential store for local development.
  # Dev mode keeps everything in memory, unsealed, with a fixed root token:
  # never use it outside development
  vault:
    image: hashicorp/vault:1.20
    container_name: gogi-vault
    cap_add:
      - IPC_LOCK
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=gogi-dev-root-token
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200
    ports:
      - "8200:8200"

  # LocalStack emulates AWS Secrets Manager. Start it with
  # GOGI_CREDENTIAL_STORE=aws docker compose --profile aws up
  localstack:
    image: localstack/localstack:4
    container_name: gogi-localstack
    profiles:
      - aws
    environment:
      - SERVICES=secretsmanager
    ports:
      - "4566:4566"

  llms:
    build:
      context: .
      dockerfile: docker/llms.Dockerfile
    container_name: gogi-llms
    environment:
      - GOGI_OBSERVABILITY_ADDR=observability:50062
      - GOGI_LOG_LEVEL=debug
      - GOGI_GATEWAY_URL=gateway:50051
      - GOGI_GATEWAY_INSECURE="1"   # in-cluster gRPC is plaintext
      - GOGI_VECTOR_DB_TYPE=chroma
      - GOGI_VECTOR_DB_HOST=chromadb
      - GOGI_VECTOR_DB_PORT=8000
      - GOGI_LLMS_PORT=:50057
      - ANTHROPIC_API_KEY=1234569878
      - OPENAI_API_KEY=1234569878
      # credential store of registered models: vault (default) or aws (LocalStack)
      - GOGI_CREDENTIAL_STORE=${GOGI_CREDENTIAL_STORE:-vault}
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=gogi-dev-root-token
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      # the embedding models gogi runs; applications' own models may be on the developer's machine, e.g.
      # host.docker.internal, but never at the cloud's metadata endpoint
      - GOGI_EMBEDDINGS_BGE_SMALL_URL=http://embeddings-bge-small/v1
      - GOGI_EMBEDDINGS_MINILM_URL=http://embeddings-minilm/v1
      - GOGI_EMBEDDINGS_ALLOW_PRIVATE_URLS=true
      # OpenAI's embeddings; the @fake-openai scenarios point it at the fake model server (bdd/)
      - GOGI_EMBEDDINGS_OPENAI_URL=${GOGI_EMBEDDINGS_OPENAI_URL:-https://api.openai.com/v1}
    depends_on:
      - postgres
      - chromadb
      - vault
      - embeddings-bge-small
      - embeddings-minilm
    # models served on the host, e.g. by Ollama, are registered at host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # the small text embedding models gogi runs, each in a text embeddings inference server of its own; they download
  # their model once, into the volume; one tokenizer and small batches keep each in about half a GB
  embeddings-bge-small:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8.2
    container_name: gogi-embeddings-bge-small
    command: --model-id BAAI/bge-small-en-v1.5 --tokenization-workers 1 --max-batch-tokens 4096
    volumes:
      - embedding-models:/data
    restart: unless-stopped
  embeddings-minilm:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8.2
    container_name: gogi-embeddings-minilm
    command: --model-id sentence-transformers/all-MiniLM-L6-v2 --tokenization-workers 1 --max-batch-tokens 4096
    volumes:
      - embedding-models:/data
    restart: unless-stopped
  prompts:
    build:
      context: .
      dockerfile: docker/prompts.Dockerfile
    container_name: gogi-prompts
    environment:
      - GOGI_OBSERVABILITY_ADDR=observability:50062
      - GOGI_LOG_LEVEL=debug
      - GOGI_GATEWAY_URL=gateway:50051
      - GOGI_GATEWAY_INSECURE="1"   # in-cluster gRPC is plaintext
      - GOGI_PROMPTS_PORT=:50058
      - GOGI_MINIO_HOST=minio:9000 
      - GOGI_MINIO_ROOT_USER=admin
      - GOGI_MINIO_ROOT_PASSWORD=password
    depends_on:
      - postgres
  llm-sessions:
    build:
      context: .
      dockerfile: docker/llm_sessions.Dockerfile
    container_name: gogi-llm-sessions
    environment:
      - GOGI_OBSERVABILITY_ADDR=observability:50062
      - GOGI_LOG_LEVEL=debug
      - GOGI_GATEWAY_URL=gateway:50051
      - GOGI_GATEWAY_INSECURE="1"   # in-cluster gRPC is plaintext
      - GOGI_LLMS_SESSION_PORT=:50059
      # the model that summarizes long conversations, e.g. openai and gpt-4o-mini; without
      # one, the summarize strategy truncates instead
      - GOGI_SESSIONS_SUMMARY_PROVIDER=${GOGI_SESSIONS_SUMMARY_PROVIDER:-}
      - GOGI_SESSIONS_SUMMARY_MODEL=${GOGI_SESSIONS_SUMMARY_MODEL:-}
      - GOGI_LLM_SERVICE_ADDR=llms:50057
    depends_on:
      - postgres
      - llms
  llm-tools:
    build:
      context: .
      dockerfile: docker/llm_tools.Dockerfile
    container_name: gogi-llm-tools
    environment:
      - GOGI_OBSERVABILITY_ADDR=observability:50062
      - GOGI_LOG_LEVEL=debug
      - GOGI_GATEWAY_URL=gateway:50051
      - GOGI_GATEWAY_INSECURE="1"   # in-cluster gRPC is plaintext
      - GOGI_LLM_TOOLS_PORT=:50060
      # credential store of tools: vault (default) or aws (LocalStack)
      - GOGI_CREDENTIAL_STORE=${GOGI_CREDENTIAL_STORE:-vault}
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=gogi-dev-root-token
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    # lets tools served on the host, e.g. the SDK examples' tool server, be registered
    # with endpoints on host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres
      - vault
  workflows:
    build:
      context: .
      dockerfile: docker/workflows.Dockerfile
    container_name: gogi-workflows
    environment:
      - GOGI_OBSERVABILITY_ADDR=observability:50062
      - GOGI_LOG_LEVEL=debug
      - GOGI_GATEWAY_URL=gateway:50051
      - GOGI_GATEWAY_INSECURE="1"   # in-cluster gRPC is plaintext
      - GOGI_WORKFLOWS_PORT=:50053
    depends_on:
      - postgres
  observability:
    build:
      context: .
      dockerfile: docker/observability.Dockerfile
    container_name: gogi-observability
    environment:
      - GOGI_LOG_LEVEL=debug
      - GOGI_OBSERVABILITY_PORT=:50062
    depends_on:
      - postgres
  guardrails:
    build:
      context: .
      dockerfile: docker/guardrails.Dockerfile
    container_name: gogi-guardrails
    environment:
      - GOGI_OBSERVABILITY_ADDR=observability:50062
      - GOGI_LOG_LEVEL=debug
      - GOGI_GATEWAY_URL=gateway:50051
      - GOGI_GATEWAY_INSECURE="1"   # in-cluster gRPC is plaintext
      - GOGI_GUARDRAILS_PORT=:50061
    depends_on:
      - postgres


  # ingests the documents queued in Postgres: parses them, chunks them for each embedding model, has the model
  # service embed the chunks and stores them in Chroma. In the cloud the same code runs as a function
  ingest-documents-worker:
    build:
      context: .
      dockerfile: docker/ingest_document_python_worker.Dockerfile
    environment:
      - MINIO_HOST=minio:9000
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=password
      - VECTOR_STORAGE_TYPE=chromadb
      - VECTOR_STORAGE_HOST=chromadb
      - VECTOR_STORAGE_PORT=8000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=gogi
      - DB_USER=gogi
      - DB_PASSWORD=gogi
      # the model service embeds the chunks
      - GOGI_LLM_SERVICE_ADDR=llms:50057
    depends_on:
      - postgres
      - chromadb
      - minio
      - llms
    restart: unless-stopped
volumes:
  postgres-data:
  chroma-data:
  embedding-models:
  

